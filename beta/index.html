<!--
  Sep 23, 2026: /beta used to be a SECOND copy of the signup form. Every fix had to be made on
  both pages, and the one that wasn't ("We'll email you", Sep 21) stranded the TikTok wave.
  It now forwards to the homepage, keeping ?ref= so old links still say where people came from.
  An untagged visit is marked "beta-link": this page used to guess "instagram" for everyone,
  which mislabeled every TikTok signup.
-->
<script>
  var ref = new URLSearchParams(location.search).get("ref") || "beta-link";
  location.replace("/?ref=" + encodeURIComponent(ref));
</script>
<meta http-equiv="refresh" content="0; url=/?ref=beta-link" />
